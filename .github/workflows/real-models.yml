name: real-checkpoint-audio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-checkpoint-audio
  cancel-in-progress: false

jobs:
  audio-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline reference dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow safetensors transformers==4.57.6 cmake ninja
      - name: Build CPU runtime
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMNI_CUDA=OFF
          cmake --build build --parallel 2
      - name: Fetch SHA-256 pinned public audio checkpoint
        run: python tools/fetch_checkpoints.py --model audio --output build/ci-checkpoints
      - name: Check out the pinned original audio implementation
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/THUDM/GLM-4-Voice.git build/reference/GLM-4-Voice
          git -C build/reference/GLM-4-Voice checkout --detach eb00ce9142e8d98b0ed7c57cd47e0d6d5dce9a1a
      - name: Convert encoding weights
        run: python tools/convert.py audio --checkpoint build/ci-checkpoints/vqwhisper --output build/ci-models/audio --reference-source build/reference/GLM-4-Voice
      - name: Run original encoder on short real-checkpoint fixtures
        run: >-
          python tools/reference_audio.py
          --checkpoint build/ci-checkpoints/vqwhisper
          --reference-root build/reference/GLM-4-Voice
          --output build/ci-validation/audio
          --device cpu --lengths 1 1281 12800
          --skip-padding-probes --skip-resampler-probe
      - name: Compare native CPU codes and features
        run: >-
          python tools/validate.py native
          --library build/libomni.so --model build/ci-models/audio --device cpu
          --fixtures 'build/ci-validation/audio/audio-*.npz'
          --output build/ci-validation/native-audio.json
          --repeats 2 --max-flip-rate 0
