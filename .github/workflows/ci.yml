name: build-and-test
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy pillow pytest httpx starlette python-multipart setuptools wheel cmake ninja
      - name: Configure CPU runtime
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOMNI_CUDA=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: C ABI tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python and complete synthetic model tests
        run: python -m pytest -q
        env:
          OMNI_REQUIRE_NATIVE: '1'
      - name: Build platform wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - name: Verify installed wheel outside source tree
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from omni_tokenizer.native import Library; import sys; lib=Library(); assert lib.lib.omni_version()==b'0.1.0'; assert 'torch' not in sys.modules; print(lib.path)"
      - name: Upload CPU wheel
        uses: actions/upload-artifact@v4
        with:
          name: cpu-wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

  cuda-compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git cmake ninja-build g++
      - uses: actions/checkout@v4
      - name: Compile CUDA backend without a GPU
        run: cmake -S . -B build -G Ninja -DOMNI_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86 -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 3
      - name: Test C ABI error handling only
        run: ctest --test-dir build --output-on-failure
