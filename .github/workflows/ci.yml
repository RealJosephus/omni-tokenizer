name: build-and-test
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy pillow pytest httpx starlette python-multipart setuptools wheel build cmake ninja
      - name: Exercise NumPy 1.x compatibility
        if: runner.os == 'Linux'
        run: python -m pip install 'numpy<2'
      - name: Configure CPU runtime
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOMNI_CUDA=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: C ABI tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install CMake package
        run: cmake --install build --config Release --prefix install
      - name: Build external CMake consumer
        run: >-
          cmake -S tests/cmake-consumer -B build-consumer
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
      - name: Link external CMake consumer
        run: cmake --build build-consumer --config Release --parallel 2
      - name: Python and complete synthetic model tests
        run: python -m pytest -q
        env:
          OMNI_REQUIRE_NATIVE: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: WebUI geometry tests
        run: node --test tests/webui.test.mjs
      - name: Build source distribution
        run: python -m build --sdist --no-isolation --outdir dist
      - name: Build platform wheel from source distribution
        shell: bash
        run: python -m pip wheel dist/*.tar.gz --no-deps --no-build-isolation -w dist
      - name: Verify installed wheel outside source tree
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from omni_tokenizer.native import Library; import sys; lib=Library(); assert lib.lib.omni_version()==b'0.1.0'; assert 'torch' not in sys.modules; print(lib.path)"
      - name: Upload CPU wheel
        uses: actions/upload-artifact@v4
        with:
          name: cpu-wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

  cuda-compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nvidia/cuda:11.8.0-devel-ubuntu22.04
          - image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ninja-build g++ python3-venv
          python3 -m venv /tmp/omni-build-tools
          /tmp/omni-build-tools/bin/pip install 'cmake>=3.24'
          echo /tmp/omni-build-tools/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Compile CUDA backend without a GPU
        run: cmake -S . -B build -G Ninja -DOMNI_CUDA=ON -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 3
      - name: Test C ABI error handling only
        run: ctest --test-dir build --output-on-failure
